<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internet Video Download Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-brand">
        <img src="../icons/icon-32.png" alt="IDM Logo" class="brand-logo">
        <div class="brand-text">
          <h1>Video İndirici</h1>
          <span class="brand-subtitle">IDM Asistanı</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btnRescan" class="icon-btn" title="Sayfayı Yeniden Tara">
          <svg viewBox="0 0 24 24">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
        <button id="btnOptions" class="icon-btn" title="Ayarlar">
          <svg viewBox="0 0 24 24">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page Source Info -->
    <div class="current-tab-info">
      <span class="tab-indicator"></span>
      <span id="tabDomain" class="tab-domain">Sayfa taranıyor...</span>
    </div>

    <!-- Mini Video Preview Container (Collapsible) -->
    <div id="previewContainer" class="preview-container hidden">
      <div class="preview-header">
        <span id="previewTitle">Önizleme</span>
        <button id="btnClosePreview" class="btn-close-preview" title="Kapat">✕</button>
      </div>
      <div class="preview-video-wrapper">
        <video id="previewVideo" controls preload="metadata"></video>
      </div>
    </div>

    <!-- Media List Section -->
    <main class="media-list-container">
      <!-- Empty State -->
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24">
            <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
          </svg>
        </div>
        <h3>Henüz Video Tespit Edilmedi</h3>
        <p>Sayfada bir video oynatmaya başlayın veya oynatıcıyı başlatıp yeniden tarayın.</p>
        <button id="btnScanNow" class="btn-secondary">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          Sayfayı Tara
        </button>
      </div>

      <!-- Video Cards List -->
      <div id="mediaList" class="media-list"></div>
    </main>

    <!-- Footer Actions -->
    <footer class="popup-footer">
      <div class="footer-stats">
        <label class="select-all-toggle" id="lblSelectAll" title="Tümünü Seç / Seçimi Kaldır">
          <input type="checkbox" id="chkSelectAll" class="checkbox-select-all">
          <span id="mediaCount">0 video bulundu</span>
        </label>
      </div>
      <div class="footer-actions">
        <button id="btnDownloadSelected" class="btn-download-selected disabled" disabled>
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          <span id="btnDownloadSelectedText">Seçilenleri İndir</span>
        </button>
      </div>
    </footer>
  </div>

  <script src="services/StreamDownloadEngine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
